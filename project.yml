name: Jarvis
options:
  bundleIdPrefix: com.wtre
  deploymentTarget:
    iOS: "17.0"
targets:
  Jarvis:
    type: application
    platform: iOS
    sources: [Jarvis]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wtre.jarvis
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Jarvis/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "Jarvis ti ascolta quando dici il suo nome o tieni premuto il tasto."
        NSLocalNetworkUsageDescription: "Jarvis parla con il tuo PC."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
